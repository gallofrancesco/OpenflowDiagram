<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenflowDiagram</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toolbar" role="toolbar"></div>
  <main id="workspace">
    <section id="chart-pane" aria-label="Diagramma">
      <div id="view-tabs" role="tablist"></div>
      <div id="chart-scroll" role="tabpanel"><div id="chart"></div></div>
      <div id="trace-view" role="tabpanel" hidden>
        <div id="trace-toolbar"></div>
        <div id="trace-scroll"></div>
      </div>
    </section>
    <div id="splitter" role="separator" aria-orientation="vertical"></div>
    <aside id="side"></aside>
    <section id="code-window" role="dialog" aria-label="Codice sorgente" hidden></section>
    <section id="trace-window" role="dialog" aria-label="Tabella di traccia" hidden></section>
  </main>
  <footer id="statusbar"><span id="status-text"></span></footer>
  <div id="popup" hidden></div>
  <div id="print-area"></div>
  <script type="module" src="ui/app.js"></script>
</body>
</html>
