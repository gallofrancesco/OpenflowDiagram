# Builds Openflow for Windows, macOS and Linux on every push to main, on version tags and on demand.
# The installers are attached to the run as downloadable artifacts; for tags (v1.2.3) they are
# also published as a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
            files: dist/*.exe
          - os: macos-latest
            target: --mac dmg zip
            files: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            target: --linux AppImage deb tar.gz
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: node tests/run-tests.mjs

      - name: Package
        # No signing certificates are configured: the builds are unsigned.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: openflow-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
